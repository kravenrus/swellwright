# Development dependencies only: Postgres and Valkey, reachable from this machine and nowhere else.
# Not a deployment file (see docker-compose.example.yml).
name: swellwright-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: sw
      POSTGRES_PASSWORD: ${SW_DEV_POSTGRES_PASSWORD:-swellwright-dev}
      POSTGRES_DB: swellwright
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sw -d swellwright"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: {}
