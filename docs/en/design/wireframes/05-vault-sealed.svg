<circle cx="640" cy="224" r="3" fill="#22d3ee"/>
<text x="640" y="280" font-size="22" fill="#e6edf7" font-weight="700" text-anchor="middle">The vault is sealed</text>
<text x="640" y="306" font-size="13" fill="#9fb0c8" text-anchor="middle">The service sealed itself when it started.</text>
<text x="640" y="326" font-size="13" fill="#9fb0c8" text-anchor="middle">Enter the passphrase to unseal it.</text>
