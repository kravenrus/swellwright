<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-labelledby="t d"><title id="t">First-run setup wizard wireframe</title><desc id="d">The first-run wizard at /setup, step 2 of 5: create and unseal the vault.</desc><style>text{font-family:Montserrat,Vazirmatn,'Noto Sans SC',sans-serif}.mo{font-family:'Fira Mono',monospace}use{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}path{stroke-linecap:round;stroke-linejoin:round}</style><defs><symbol id="i-circle-check" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /> <path d="M9 12l2 2l4 -4" /></symbol><symbol id="i-player-play" viewBox="0 0 24 24"><path d="M7 4v16l13 -8l-13 -8" /></symbol><symbol id="i-circle" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /></symbol><symbol id="i-eye" viewBox="0 0 24 24"><path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /> <path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" /></symbol><symbol id="i-lock-open" viewBox="0 0 24 24"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2l0 -6" /> <path d="M11 16a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /> <path d="M8 11v-5a4 4 0 0 1 8 0" /></symbol><symbol id="i-info-circle" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /> <path d="M12 9h.01" /> <path d="M11 12h1v4h1" /></symbol></defs><rect width="1280" height="900" fill="#161b22"/><line x1="0" y1="63.5" x2="1280" y2="63.5" stroke="#484f58"/>
<polygon points="52,18 64.1,25 64.1,39 52,46 39.9,39 39.9,25" fill="none" stroke="#3bc9db" stroke-width="2"/>
<path d="M43 29 q4.5 -4 9 0 t9 0" fill="none" stroke="#3bc9db" stroke-width="1.6"/>
<path d="M43 35.5 q4.5 -4 9 0 t9 0" fill="none" stroke="#4dabf7" stroke-width="1.6"/>
<text x="78" y="38" font-size="18" fill="#ffffff" font-weight="700">Swellwright</text>
<text x="1248" y="38" font-size="14" fill="#8b949e" font-weight="500" text-anchor="end">First run setup</text>
<use href="#i-circle-check" x="89" y="101" width="22" height="22" stroke="#38d9a9"/>
<text x="122" y="117" font-size="14" fill="#8b949e" font-weight="500">1  Owner</text>
<line x1="204.9" y1="112" x2="296" y2="112" stroke="#38d9a9" stroke-width="2"/>
<use href="#i-player-play" x="305" y="101" width="22" height="22" stroke="#3bc9db"/>
<text x="338" y="117" font-size="14" fill="#ffffff" font-weight="600">2  Vault</text>
<line x1="413.1" y1="112" x2="512" y2="112" stroke="#30363d" stroke-width="2"/>
<use href="#i-circle" x="521" y="101" width="22" height="22" stroke="#6e7681"/>
<text x="554" y="117" font-size="14" fill="#8b949e" font-weight="500">3  Panel</text>
<line x1="632" y1="112" x2="728" y2="112" stroke="#30363d" stroke-width="2"/>
<use href="#i-circle" x="737" y="101" width="22" height="22" stroke="#6e7681"/>
<text x="770" y="117" font-size="14" fill="#8b949e" font-weight="500">4  Fleet</text>
<line x1="844.6" y1="112" x2="944" y2="112" stroke="#30363d" stroke-width="2"/>
<use href="#i-circle" x="953" y="101" width="22" height="22" stroke="#6e7681"/>
<text x="986" y="117" font-size="14" fill="#8b949e" font-weight="500">5  Notifications</text>
<circle cx="76" cy="112" r="11" fill="#ffa94d"/>
<text x="76" y="116.4" font-size="12" fill="#1a1100" font-weight="700" text-anchor="middle">1</text>
<rect x="80.5" y="160.5" width="799" height="699" rx="8" fill="#1b2026" stroke="#292d34"/>
<text x="112" y="206" font-size="20" fill="#ffffff" font-weight="600">Create and unseal the vault</text>
<text x="112" y="232" font-size="14" fill="#8b949e">The vault encrypts every secret Swellwright stores. It stays on this server.</text>
<text x="112" y="276" font-size="14" fill="#c9d1d9" font-weight="500">Passphrase</text>
<rect x="112.5" y="284.5" width="735" height="35" rx="8" fill="#21262d" stroke="#484f58"/>
<text x="126" y="308" font-size="16" fill="#ffffff">•••••••••••••••••••••</text>
<use href="#i-eye" x="817" y="293" width="18" height="18" stroke="#8b949e"/>
<rect x="112" y="336" width="736" height="8" rx="4" fill="#484f58"/>
<rect x="112" y="336" width="515.2" height="8" rx="4" fill="#38d9a9"/>
<text x="112" y="366" font-size="12" fill="#8b949e">Strong: about 78 bits (length counts more than symbols)</text>
<text x="112" y="396" font-size="14" fill="#c9d1d9" font-weight="500">Confirm passphrase</text>
<rect x="112.5" y="404.5" width="735" height="35" rx="8" fill="#21262d" stroke="#484f58"/>
<text x="126" y="428" font-size="16" fill="#ffffff">•••••••••••••••••••••</text>
<text x="112" y="480" font-size="14" fill="#c9d1d9" font-weight="500">Second factor (optional)</text>
<rect x="112.5" y="490.5" width="735" height="48" rx="8" fill="none" stroke="#484f58" stroke-dasharray="6 5"/>
<text x="480" y="520" font-size="13" fill="#6e7681" text-anchor="middle">Drop a key file here or choose a file</text>
<circle cx="80" cy="276" r="11" fill="#ffa94d"/>
<text x="80" y="280.4" font-size="12" fill="#1a1100" font-weight="700" text-anchor="middle">2</text>
<text x="112" y="570" font-size="14" fill="#c9d1d9" font-weight="500">Recovery kit</text>
<rect x="112.5" y="582.5" width="363" height="70" rx="8" fill="#0e2e36" stroke="#164f5a"/>
<circle cx="138" cy="617" r="9" fill="none" stroke="#3bc9db" stroke-width="1.6"/>
<circle cx="138" cy="617" r="4.5" fill="#3bc9db"/>
<text x="160" y="610" font-size="14" fill="#ffffff" font-weight="600">Shamir 3 of 5</text>
<text x="160" y="632" font-size="12" fill="#8b949e">five shares, any three recover the vault</text>
<rect x="484.5" y="582.5" width="363" height="70" rx="8" fill="#1b2026" stroke="#292d34"/>
<circle cx="510" cy="617" r="9" fill="none" stroke="#484f58" stroke-width="1.6"/>
<text x="532" y="610" font-size="14" fill="#ffffff" font-weight="600">Printed recovery key</text>
<text x="532" y="632" font-size="12" fill="#8b949e">shown once, store it on paper</text>
<circle cx="112" cy="582" r="11" fill="#ffa94d"/>
<text x="112" y="586.4" font-size="12" fill="#1a1100" font-weight="700" text-anchor="middle">3</text>
<rect x="112.5" y="678.5" width="17" height="17" rx="4" fill="#0c8599" stroke="#0c8599"/>
<path d="M116 687 l3.5 3.5 l7 -8" fill="none" stroke="#ffffff" stroke-width="2"/>
<text x="140" y="692" font-size="14" fill="#c9d1d9">I have stored the recovery kit outside this server</text>
<rect x="112.5" y="790.5" width="109" height="39" rx="8" fill="#21262d" stroke="#484f58"/>
<text x="148.9" y="815" font-size="14" fill="#ffffff" font-weight="600">Back</text>
<rect x="628" y="790" width="220" height="40" rx="8" fill="#0c8599"/>
<use href="#i-lock-open" x="660.6" y="802" width="16" height="16" stroke="#ffffff"/>
<text x="684.6" y="815" font-size="14" fill="#ffffff" font-weight="600">Create and unseal</text>
<rect x="896.5" y="160.5" width="303" height="699" rx="8" fill="#1b2026" stroke="#292d34"/>
<text x="912" y="190" font-size="15" fill="#ffffff" font-weight="600">What happens next</text>
<circle cx="924" cy="220" r="12" fill="#063943" stroke="#0f5f6c"/>
<text x="924" y="224.5" font-size="12" fill="#e3fafc" font-weight="600" text-anchor="middle">1</text>
<text x="948" y="224" font-size="13" fill="#b1bac4">The vault is created and</text>
<text x="948" y="243" font-size="13" fill="#b1bac4">unsealed.</text>
<circle cx="924" cy="300" r="12" fill="#063943" stroke="#0f5f6c"/>
<text x="924" y="304.5" font-size="12" fill="#e3fafc" font-weight="600" text-anchor="middle">2</text>
<text x="948" y="304" font-size="13" fill="#b1bac4">You connect the Remnawave</text>
<text x="948" y="323" font-size="13" fill="#b1bac4">panel with an API token.</text>
<circle cx="924" cy="380" r="12" fill="#063943" stroke="#0f5f6c"/>
<text x="924" y="384.5" font-size="12" fill="#e3fafc" font-weight="600" text-anchor="middle">3</text>
<text x="948" y="384" font-size="13" fill="#b1bac4">Swellwright imports the fleet and</text>
<text x="948" y="403" font-size="13" fill="#b1bac4">adopts the nodes.</text>
<circle cx="924" cy="460" r="12" fill="#063943" stroke="#0f5f6c"/>
<text x="924" y="464.5" font-size="12" fill="#e3fafc" font-weight="600" text-anchor="middle">4</text>
<text x="948" y="464" font-size="13" fill="#b1bac4">Notifications and schedules</text>
<text x="948" y="483" font-size="13" fill="#b1bac4">come last.</text>
<line x1="912" y1="520" x2="1184" y2="520" stroke="#24292f"/>
<use href="#i-info-circle" x="920" y="548" width="16" height="16" stroke="#4dabf7"/>
<text x="948" y="561" font-size="13" fill="#ffffff" font-weight="600">Auto-unseal is off.</text>
<text x="912" y="592" font-size="13" fill="#b1bac4">After a restart you enter the</text>
<text x="912" y="612" font-size="13" fill="#b1bac4">passphrase again.</text>
<text x="912" y="664" font-size="13" fill="#b1bac4">Nothing leaves your server.</text></svg>
