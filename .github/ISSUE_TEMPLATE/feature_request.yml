name: Feature request
description: Propose a feature, scenario or plugin
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what is painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
  - type: dropdown
    id: kind
    attributes:
      label: Where should it live
      options: [Core, Official plugin, Example or pack, Documentation, Not sure]
