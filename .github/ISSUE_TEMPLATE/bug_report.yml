name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real credentials, IP addresses or domains. Report vulnerabilities privately (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Swellwright version
    validations:
      required: true
  - type: input
    id: panel
    attributes:
      label: Remnawave panel version
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output (redacted)
      render: shell
