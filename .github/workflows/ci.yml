name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      # TODO: pin actions by commit SHA before the first release (supply-chain policy).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repository hygiene (secrets, personal data, forbidden patterns)
        env:
          SW_FORBIDDEN_PATTERNS: ${{ secrets.SW_FORBIDDEN_PATTERNS }}
        run: python3 scripts/check-hygiene.py
      - name: DCO sign-off
        if: github.event_name == 'pull_request'
        run: bash scripts/check-dco.sh "origin/${{ github.base_ref }}" "${{ github.sha }}"
